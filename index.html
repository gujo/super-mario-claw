// --- AUDIO ENGINE ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playSound(freq, duration, type='square', vol=0.15) {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playMusic() {

    // Phrase 4 — ethereal
    [1047,2],[988,1],[880,1],[784,2],[0,1],
    [659,1.5],[587,1],[523,1.5],[440,2],[0,2],
  ];

  // Deep bass — slow, heavy
  const bass = [
    [110,3],[0,1],[131,3],[0,1],
    [147,3],[0,1],[110,3],[0,1],
    [165,3],[0,1],[147,3],[0,1],
    [131,3],[0,1],[110,2],[131,2],
    [147,3],[0,1],[165,3],[0,1],
    [131,2],[110,2],[98,3],[0,1],
  ];

  // Arpeggio layer — shimmery
  const arp = [
    [880,0.25],[1047,0.25],[1319,0.25],[1047,0.25],
    [880,0.25],[698,0.25],[880,0.25],[1047,0.25],
    [784,0.25],[988,0.25],[1175,0.25],[988,0.25],
    [784,0.25],[659,0.25],[784,0.25],[988,0.25],
  ];

  // Schedule melody
  let t = 0;
  for (const [freq, dur] of melody) {
    if (freq > 0) {
      const ft = t;
      setTimeout(() => {
        if (musicPlaying && gameState === 'playing') {
          playSound(freq, beat * dur * 0.85, 'sine', 0.07);
          // Add a detuned echo for spacey feel
          playSound(freq * 1.005, beat * dur * 0.6, 'sine', 0.03);
        }
      }, ft * 1000);
    }
    t += beat * dur;
  }

  // Schedule bass
  let bt = 0;
  for (const [freq, dur] of bass) {
    if (freq > 0) {
      const fbt = bt;
      setTimeout(() => {
        if (musicPlaying && gameState === 'playing') playSound(freq, beat * dur * 0.9, 'triangle', 0.09);
      }, fbt * 1000);
    }
    bt += beat * dur;
  }

  // Schedule arpeggios — repeating shimmer throughout
  const totalTime = t;
  let at = 0;
  while (at < totalTime) {
    for (const [freq, dur] of arp) {
      if (at >= totalTime) break;
      const fat = at;
      setTimeout(() => {
        if (musicPlaying && gameState === 'playing') playSound(freq, beat * dur * 0.5, 'sine', 0.025);
      }, fat * 1000);
      at += beat * dur;
    }
  }

  // Loop
  musicTimeout = setTimeout(() => {
    if (musicPlaying && gameState === 'playing') playMusic();
  }, totalTime * 1000);
}

function stopMusic() {
  musicPlaying = false;
  if (musicTimeout) { clearTimeout(musicTimeout); musicTimeout = null; }
}

  osc1.frequency.setValueAtTime(2000, now);
  osc1.frequency.exponentialRampToValueAtTime(200, now + 0.15);

  osc2.frequency.exponentialRampToValueAtTime(100, now + 0.2);
  gain1.gain.setValueAtTime(0.15, now);
  gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  gain2.gain.setValueAtTime(0.08, now);
  gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
  osc1.connect(gain1); gain1.connect(audioCtx.destination);
  osc2.connect(gain2); gain2.connect(audioCtx.destination);
  osc1.start(now); osc1.stop(now + 0.15);
  osc2.start(now + 0.03); osc2.stop(now + 0.2);
}

let questionHit = new Set();

function loadLevel(n) {
  const L = LEVELS[n - 1];
  levelTiles = [];
  for (const p of L.platforms) {
    levelTiles.push({...p});
  }
  coinList = L.coins.map(c => ({x: c.x * TILE + 8, y: c.y * TILE + 4, w: 16, h: 16, collected: false, bobOffset: Math.random() * Math.PI * 2}));
  crabList = L.crabs.map(c => ({x: c.x * TILE, y: c.y * TILE, w: 28, h: 24, vx: (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.8), alive: true, frame: 0, frameTimer: 0, squishTimer: 0}));
  jellyList = (L.jellyfish || []).map(j => ({x: j.x * TILE, y: j.y * TILE, baseY: j.y * TILE, w: 24, h: 24, alive: true, frame: 0, squishTimer: 0}));
  urchinList = (L.urchins || []).map(u => ({x: u.x * TILE, y: u.y * TILE, w: 28, h: 24, frame: 0}));
  seagullList = (L.seagulls || []).map(s => ({x: s.x * TILE, y: s.y * TILE, baseY: s.y * TILE, w: 30, h: 20, vx: -2, alive: true, frame: 0, squishTimer: 0}));
  tubeList = (L.tubes || []).map(t => ({x: t.x * TILE, y: t.y * TILE, w: TILE * 2, h: TILE * 2, destLevel: t.destLevel, destX: t.destX * TILE, destY: t.destY * TILE, color: t.color || '#0F0', frame: 0}));
  teleporting = false; teleportTimer = 0;
  powerups = [];
  lasers = [];
  player.starTimer = 0;
  player.big = false;
  player.laserTimer = 0;
  player.laserCooldown = 0;
  player.mushroomTimer = 0;

  // Assign powerups to question blocks — laser is always first!
  const qBlocks = levelTiles.filter(t => t.t === 3);
  if (qBlocks.length >= 1) qBlocks[0].powerup = 'laser';
  if (qBlocks.length >= 2) qBlocks[1].powerup = 'crab';
  if (qBlocks.length >= 3) qBlocks[2].powerup = 'mushroom'; // MAGIC MUSHROOM
  if (qBlocks.length >= 4) qBlocks[3].powerup = 'starfish';
  if (qBlocks.length >= 5) qBlocks[4].powerup = 'oneup';
  for (let i = 5; i < qBlocks.length; i++) {
    const r = Math.random();
    if (r < 0.25) qBlocks[i].powerup = 'laser';
    else if (r < 0.4) qBlocks[i].powerup = 'crab';
    else if (r < 0.55) qBlocks[i].powerup = 'mushroom';
    else if (r < 0.7) qBlocks[i].powerup = 'starfish';
    else if (r < 0.8) qBlocks[i].powerup = 'oneup';
    // else: coin (default)
  }

  // Randomize level elements heavily
  const Ldata = LEVELS[level - 1];
  for (const crab of crabList) {
    crab.x += (Math.random() - 0.5) * TILE * 4;
    crab.vx *= (0.7 + Math.random() * 0.8); // Vary speed
  }
  for (const jelly of jellyList) {
    jelly.baseY += (Math.random() - 0.5) * TILE * 3;
    jelly.y = jelly.baseY;
  }
  for (const gull of seagullList) {
    gull.baseY += (Math.random() - 0.5) * TILE * 2;
    gull.vx *= (0.8 + Math.random() * 0.6);
  }
  // Bonus random coins — more of them, wider spread
  for (let i = 0; i < 8 + Math.floor(Math.random() * 5); i++) {
    const rx = (8 + Math.random() * (Ldata.width - 16)) * TILE;
    const ry = (2 + Math.random() * 8) * TILE;
    coinList.push({x: rx, y: ry, w: 16, h: 16, collected: false, bobOffset: Math.random() * Math.PI * 2});
  }
  // Random extra floating platforms (2-5 per level)
  const extraPlats = 2 + Math.floor(Math.random() * 4);
  for (let i = 0; i < extraPlats; i++) {
    const px = Math.floor(10 + Math.random() * (Ldata.width - 20));
    const py = Math.floor(4 + Math.random() * 6);
    const pLen = 2 + Math.floor(Math.random() * 3);
    for (let j = 0; j < pLen; j++) {
      const tileType = Math.random() < 0.3 ? 3 : 2;
      levelTiles.push({x: px + j, y: py, t: tileType});
    }
  }
  // Random extra enemies (1-3)
  const extraEnemies = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < extraEnemies; i++) {
    const ex = (15 + Math.random() * (Ldata.width - 30)) * TILE;
    if (Math.random() < 0.5) {
      crabList.push({x: ex, y: 12 * TILE, w: 28, h: 24, vx: (Math.random()>0.5?1:-1)*(0.8+Math.random()*0.8), alive: true, frame: 0, frameTimer: 0, squishTimer: 0});
    } else {
      seagullList.push({x: ex, y: (2+Math.random()*4)*TILE, baseY: (2+Math.random()*4)*TILE, w: 30, h: 20, vx: -1.5-Math.random(), alive: true, frame: 0, squishTimer: 0});
    }
  }

  // Easter egg: rare surprise spawns
  surpriseTimer = 0;
  surpriseActive = false;
  flagPos = {x: L.flag.x * TILE, y: L.flag.y * TILE};
  player.x = L.playerStart.x * TILE;
  player.y = L.playerStart.y * TILE;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  cameraX = 0;
  questionHit = new Set();
  particles = [];
  floatTexts = [];
}

// --- TILE COLLISION ---
function getTile(tx, ty) {
  return levelTiles.find(t => t.x === tx && t.y === ty);
}

function isSolid(tx, ty) {
  return !!getTile(tx, ty);
}

function worldCollide(entity) {
  const left = Math.floor(entity.x / TILE);
  const right = Math.floor((entity.x + entity.width - 1) / TILE);
  const top = Math.floor(entity.y / TILE);
  const bottom = Math.floor((entity.y + entity.height - 1) / TILE);

  entity.onGround = false;

  // Vertical
  if (entity.vy > 0) {
    for (let tx = left; tx <= right; tx++) {
      if (isSolid(tx, bottom)) {
        entity.y = bottom * TILE - entity.height;
        entity.vy = 0;
        entity.onGround = true;
        break;
      }
    }
  } else if (entity.vy < 0) {
    for (let tx = left; tx <= right; tx++) {
      if (isSolid(tx, top)) {
        entity.y = (top + 1) * TILE;
        entity.vy = 0;
        // Hit brick — break it!
        const tile = getTile(tx, top);
        if (tile && tile.t === 2) {
          // Remove the brick
          const idx = levelTiles.indexOf(tile);
          if (idx !== -1) levelTiles.splice(idx, 1);
          playSound(150, 0.15, 'sawtooth', 0.2);
          score += 10;
          // Brick debris particles
          for (let i = 0; i < 8; i++) {
            particles.push({
              x: tx * TILE + 16, y: top * TILE + 8,
              vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 6 - 2,
              life: 35, color: LEVELS[level-1].brickColor || '#C84C09', size: 4 + Math.random() * 3
            });
          }
          floatTexts.push({x: tx * TILE, y: top * TILE - 10, text: 'SMASH!', timer: 25, vy: -2});
        }
        // Hit question block
        if (tile && tile.t === 3 && !questionHit.has(`${tx},${top}`)) {
          questionHit.add(`${tx},${top}`);
          // Some question blocks spawn powerups
          if (tile.powerup === 'mushroom') {
            spawnPowerup(tx, top, 'mushroom');
            sfxPowerup();
          } else if (tile.powerup === 'laser') {
            spawnPowerup(tx, top, 'laser');
            sfxPowerup();
          } else if (tile.powerup === 'crab') {
            spawnPowerup(tx, top, 'crab');
            sfxPowerup();
          } else if (tile.powerup === 'starfish') {
            spawnPowerup(tx, top, 'starfish');
            sfxStar();
          } else if (tile.powerup === 'oneup') {
            spawnPowerup(tx, top, 'oneup');
            sfxOneUp();
          } else {
            score += 100;
            coins++;
            sfxCoin();
            floatTexts.push({x: tx * TILE, y: top * TILE - 10, text: '+100', timer: 40, vy: -1.5});
            for (let i = 0; i < 4; i++) {
              particles.push({x: tx*TILE+16, y: top*TILE, vx: (Math.random()-0.5)*3, vy: -Math.random()*4-2, life: 30, color: '#FFD700', size: 3});
            }
          }
        }
        break;
      }
    }
  }

  // Recalculate after vertical
  const left2 = Math.floor(entity.x / TILE);
  const right2 = Math.floor((entity.x + entity.width - 1) / TILE);
  const top2 = Math.floor(entity.y / TILE);
  const bottom2 = Math.floor((entity.y + entity.height - 1) / TILE);

  // Horizontal
  if (entity.vx > 0) {
    for (let ty = top2; ty <= bottom2; ty++) {
      if (isSolid(right2, ty)) {
        entity.x = right2 * TILE - entity.width;
        entity.vx = 0;
        break;
      }
    }
  } else if (entity.vx < 0) {
    for (let ty = top2; ty <= bottom2; ty++) {
      if (isSolid(left2, ty)) {
        entity.x = (left2 + 1) * TILE;
        entity.vx = 0;
        break;
      }
    }
  }
}

// --- DRAWING HELPERS ---
function drawPixelChar(x, y, facing, frame) {
  const px = Math.round(x - cameraX);
  const py = Math.round(y);
  ctx.save();

  // Star flash — cycle through rainbow colors
  let bodyColor = '#E84040';
  let hatColor = '#E84040';
  let skinColor = '#FFB880';
  let jeansColor = '#2a2a3a';
  let shoeColor = '#FFF';
  if (player.starTimer > 0) {
    const starColors = ['#FF0000','#FF8800','#FFFF00','#00FF00','#0088FF','#8800FF'];
    const ci = Math.floor(player.starFlash / 4) % starColors.length;
    bodyColor = starColors[ci];
    hatColor = starColors[(ci + 2) % starColors.length];
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 15;
  }
  // Mushroom trip color shift
  if (player.mushroomTimer > 0) {
    const hShift = Math.sin(Date.now() * 0.005) * 30;
    skinColor = `hsl(${30 + hShift}, 80%, 75%)`;
    bodyColor = `hsl(${0 + hShift}, 70%, 55%)`;
    hatColor = bodyColor;
  }

  if (player.invincible > 0 && player.starTimer <= 0 && Math.floor(player.invincible / 3) % 2) {
    ctx.globalAlpha = 0.4;
  }

  // Scale up if big
  const sc = player.big ? 1.3 : 1;
  const ox = player.big ? -4 : 0;
  const oy = player.big ? -10 : 0;
  ctx.translate(px + ox, py + oy);
  ctx.scale(sc, sc);
  ctx.translate(-(px + ox), -(py + oy));

  // Determine animation state
  const isJumping = !player.onGround;
  const isRunning = Math.abs(player.vx) > 0.5;
  const runCycle = Math.sin(frame * 0.4); // smooth sine for leg/arm swing
  const breathe = Math.sin(Date.now() * 0.003) * 0.5; // subtle idle breathing

  // Body tilt when running
  const tilt = isRunning ? facing * Math.sin(frame * 0.15) * 0.03 : 0;
  ctx.translate(px + 12, py + 16);
  ctx.rotate(tilt);
  ctx.translate(-(px + 12), -(py + 16));

  // --- ARMS ---
  const armSwing = isRunning ? runCycle * 6 : (isJumping ? -4 : breathe);
  // Back arm
  ctx.fillStyle = bodyColor;
  const backArmX = facing > 0 ? px + 1 : px + 17;
  ctx.save();
  ctx.translate(backArmX + 3, py + 10);
  ctx.rotate((facing > 0 ? -1 : 1) * armSwing * 0.05);
  ctx.fillRect(-3, 0, 5, 10);
  ctx.fillStyle = skinColor;
  ctx.fillRect(-2, 9, 4, 3); // hand
  ctx.restore();

  // --- HOODIE BODY (rounded) ---
  ctx.fillStyle = bodyColor;
  // Main torso
  ctx.beginPath();
  ctx.moveTo(px + 5, py + 8);
  ctx.lineTo(px + 19, py + 8);
  ctx.quadraticCurveTo(px + 22, py + 10, px + 21, py + 22);
  ctx.lineTo(px + 3, py + 22);
  ctx.quadraticCurveTo(px + 2, py + 10, px + 5, py + 8);
  ctx.fill();

  // --- HEAD (rounder) ---
  ctx.fillStyle = skinColor;
  ctx.beginPath();
  ctx.ellipse(px + 12, py + 4, 7, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hoodie hood
  ctx.fillStyle = hatColor;
  ctx.beginPath();
  ctx.ellipse(px + 12, py + 1, 8, 5, 0, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(px + 4, py + 1, 16, 4);

  // Headphones
  ctx.fillStyle = '#333';
  ctx.fillRect(px + 3, py + 0, 3, 5);
  ctx.fillRect(px + 18, py + 0, 3, 5);
  ctx.fillStyle = '#444';
  ctx.fillRect(px + 5, py - 3, 14, 3);

  // Sunglasses
  ctx.fillStyle = '#111';
  const glassY = py + 3;
  if (facing > 0) {
    ctx.fillRect(px + 9, glassY, 9, 4);
    ctx.fillRect(px + 7, glassY + 1, 2, 2); // bridge
    ctx.fillStyle = '#0FF';
    ctx.fillRect(px + 15, glassY + 1, 2, 2);
  } else {
    ctx.fillRect(px + 6, glassY, 9, 4);
    ctx.fillRect(px + 15, glassY + 1, 2, 2);
    ctx.fillStyle = '#0FF';
    ctx.fillRect(px + 7, glassY + 1, 2, 2);
  }

  // Mouth (subtle)
  if (isJumping) {
    ctx.fillStyle = '#c88060';
    ctx.fillRect(px + 11, py + 7, 3, 2); // open mouth when jumping
  }

  // Hoodie pocket
  ctx.fillStyle = hatColor === bodyColor ? '#FFF' : '#DDD';
  ctx.font = '6px monospace';
  ctx.fillText('{;}', px + 6, py + 19);

  // --- FRONT ARM ---
  ctx.fillStyle = bodyColor;
  const frontArmX = facing > 0 ? px + 17 : px + 1;
  ctx.save();
  ctx.translate(frontArmX + 3, py + 10);
  ctx.rotate((facing > 0 ? 1 : -1) * armSwing * 0.05);
  ctx.fillRect(-3, 0, 5, 10);
  ctx.fillStyle = skinColor;
  ctx.fillRect(-2, 9, 4, 3);
  ctx.restore();

  // Laser arm glow
  if (player.laserTimer > 0) {
    ctx.shadowColor = '#0FF';
    ctx.shadowBlur = 8 + Math.sin(Date.now() * 0.01) * 4;
    ctx.fillStyle = '#0FF';
    const laserArmX = facing > 0 ? px + 19 : px - 1;
    ctx.fillRect(laserArmX, py + 12, 5, 4);
    ctx.shadowBlur = 0;
  }

  // --- LEGS with animation ---
  ctx.fillStyle = jeansColor;
  if (isJumping) {
    // Jumping pose — legs tucked or spread
    const jumpPhase = player.vy < 0 ? 1 : -1;
    ctx.save();
    ctx.translate(px + 8, py + 22);
    ctx.rotate(-0.15 * jumpPhase);
    ctx.fillRect(-3, 0, 5, 9);
    ctx.restore();
    ctx.save();
    ctx.translate(px + 16, py + 22);
    ctx.rotate(0.15 * jumpPhase);
    ctx.fillRect(-3, 0, 5, 9);
    ctx.restore();
    // Shoes
    ctx.fillStyle = shoeColor;
    ctx.fillRect(px + 3, py + 29, 7, 3);
    ctx.fillRect(px + 14, py + 29, 7, 3);
  } else if (isRunning) {
    // Running legs — alternating stride
    const stride = runCycle * 5;
    ctx.save();
    ctx.translate(px + 8, py + 22);
    ctx.rotate(stride * 0.06);
    ctx.fillRect(-3, 0, 5, 9);
    ctx.restore();
    ctx.save();
    ctx.translate(px + 16, py + 22);
    ctx.rotate(-stride * 0.06);
    ctx.fillRect(-3, 0, 5, 9);
    ctx.restore();
    // Shoes with motion blur
    ctx.fillStyle = shoeColor;
    const shoeOff1 = Math.sin(frame * 0.4) * 3;
    const shoeOff2 = Math.sin(frame * 0.4 + Math.PI) * 3;
    ctx.fillRect(px + 3 + shoeOff1, py + 29, 7, 3);
    ctx.fillRect(px + 14 + shoeOff2, py + 29, 7, 3);
    ctx.fillStyle = '#E84040';
    ctx.fillRect(px + 4 + shoeOff1, py + 30, 5, 2);
    ctx.fillRect(px + 15 + shoeOff2, py + 30, 5, 2);
  } else {
    // Idle — subtle breathing bob
    const bob = breathe * 0.5;
    ctx.fillRect(px + 5, py + 22 + bob, 5, 9);
    ctx.fillRect(px + 14, py + 22 + bob, 5, 9);
    ctx.fillStyle = shoeColor;
    ctx.fillRect(px + 3, py + 29 + bob, 7, 3);
    ctx.fillRect(px + 14, py + 29 + bob, 7, 3);
    ctx.fillStyle = '#E84040';
    ctx.fillRect(px + 4, py + 30 + bob, 5, 2);
    ctx.fillRect(px + 15, py + 30 + bob, 5, 2);
  }

  ctx.restore();
}

function drawCrab(crab) {
  const px = Math.round(crab.x - cameraX);
  const py = Math.round(crab.y);

  if (crab.squishTimer > 0) {
    // Squished crab
    ctx.fillStyle = '#D44';
    ctx.fillRect(px + 2, py + 18, 24, 6);
    ctx.fillStyle = '#F88';
    ctx.fillRect(px + 4, py + 19, 20, 4);
    return;
  }

  // Shell
  ctx.fillStyle = '#D44';
  ctx.fillRect(px + 4, py + 4, 20, 16);
  ctx.fillStyle = '#F66';
  ctx.fillRect(px + 6, py + 6, 16, 12);

  // Claws
  const clawAnim = Math.sin(crab.frame * 0.15) * 2;
  ctx.fillStyle = '#D44';
  ctx.fillRect(px - 2, py + 4 + clawAnim, 8, 6);
  ctx.fillRect(px + 22, py + 4 - clawAnim, 8, 6);
  // Claw tips
  ctx.fillStyle = '#F88';
  ctx.fillRect(px - 2, py + 2 + clawAnim, 4, 4);
  ctx.fillRect(px + 26, py + 2 - clawAnim, 4, 4);

  // Eyes
  ctx.fillStyle = '#FFF';
  ctx.fillRect(px + 8, py + 2, 5, 5);
  ctx.fillRect(px + 16, py + 2, 5, 5);
  ctx.fillStyle = '#000';
  ctx.fillRect(px + 10, py + 3, 2, 3);
  ctx.fillRect(px + 18, py + 3, 2, 3);

  // Legs
  ctx.fillStyle = '#C33';
  const legA = Math.sin(crab.frame * 0.2) * 2;
  ctx.fillRect(px + 6, py + 20, 4, 4 + legA);
  ctx.fillRect(px + 12, py + 20, 4, 4 - legA);
  ctx.fillRect(px + 18, py + 20, 4, 4 + legA);
}

function drawTile(tile) {
  const px = tile.x * TILE - cameraX;
  const py = tile.y * TILE;
  const L = LEVELS[level - 1];

  if (px < -TILE || px > canvas.width + TILE) return;

  if (tile.t === 1) {
    // Ground
    ctx.fillStyle = L.groundColor;
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#5a8a20';
    if (tile.y <= 13) {
      ctx.fillRect(px, py, TILE, 4);
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.strokeRect(px, py, TILE, TILE);
  } else if (tile.t === 2) {
    // Brick
    ctx.fillStyle = L.brickColor;
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.strokeRect(px, py, TILE, TILE);
    ctx.strokeRect(px, py, TILE/2, TILE/2);
    ctx.strokeRect(px + TILE/2, py + TILE/2, TILE/2, TILE/2);
  } else if (tile.t === 3) {
    // Question block
    const hit = questionHit.has(`${tile.x},${tile.y}`);
    ctx.fillStyle = hit ? '#888' : '#FFB800';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.strokeRect(px, py, TILE, TILE);
    if (!hit) {
      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('?', px + 10, py + 24);
    }
  }
}

function drawCoin(coin) {
  const px = Math.round(coin.x - cameraX);
  const py = Math.round(coin.y + Math.sin(coin.bobOffset + Date.now() * 0.004) * 3);
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(px + 8, py + 8, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFA500';
  ctx.beginPath();
  ctx.arc(px + 8, py + 8, 4, 0, Math.PI * 2);
  ctx.fill();
}

function drawFlag() {
  const px = Math.round(flagPos.x - cameraX);
  const py = Math.round(flagPos.y);
  // Pole
  ctx.fillStyle = '#888';
  ctx.fillRect(px + 14, py, 4, TILE * 11);
  // Ball on top
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(px + 16, py, 6, 0, Math.PI * 2);
  ctx.fill();
  // Flag
  ctx.fillStyle = '#E84040';
  ctx.beginPath();
  ctx.moveTo(px + 18, py + 4);
  ctx.lineTo(px + 46, py + 16);
  ctx.lineTo(px + 18, py + 28);
  ctx.fill();
  // Claw symbol on flag
  ctx.fillStyle = '#FFF';
  ctx.font = '12px monospace';
  ctx.fillText('🦀', px + 22, py + 21);
}

function drawClouds() {
  const L = LEVELS[level - 1];
  ctx.fillStyle = L.bg === '#1a1a2e' ? 'rgba(100,100,150,0.3)' : 'rgba(255,255,255,0.8)';
  for (let i = 0; i < 8; i++) {
    const cx = ((i * 300 + 50) - cameraX * 0.3) % (canvas.width + 200);
    const cy = 40 + (i % 3) * 35;
    ctx.beginPath();
    ctx.arc(cx, cy, 25, 0, Math.PI * 2);
    ctx.arc(cx + 25, cy - 5, 20, 0, Math.PI * 2);
    ctx.arc(cx + 50, cy, 25, 0, Math.PI * 2);
    ctx.arc(cx + 25, cy + 5, 22, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawHills() {
  const L = LEVELS[level - 1];
  ctx.fillStyle = L.bg === '#1a1a2e' ? '#2a2a4e' : '#5a9a30';
  for (let i = 0; i < 6; i++) {
    const hx = ((i * 400) - cameraX * 0.2) % (canvas.width + 500);
    const hw = 150 + (i % 2) * 80;
    const hh = 60 + (i % 3) * 30;
    ctx.beginPath();
    ctx.arc(hx + hw/2, canvas.height - 64, hw/2, Math.PI, 0);
    ctx.fill();
  }
}

// --- GAME OVER SCREEN ---
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#E84040';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SEGFAULT', canvas.width/2, 170);
  ctx.fillStyle = '#F00';
  ctx.font = '16px monospace';
  ctx.fillText('Process "vibe_coder" terminated (signal 11)', canvas.width/2, 205);
  ctx.fillStyle = '#0F0';
  ctx.font = '14px monospace';
  ctx.fillText(`$ cat /var/log/score.txt`, canvas.width/2, 245);

  ctx.font = '22px monospace';
  ctx.fillText(`SCORE: ${score}   COINS: ${coins}`, canvas.width/2, 280);
  ctx.fillStyle = '#888';
  ctx.font = '12px monospace';
  const deathQuotes = [
    'The crabs send their regards.',
    'Have you tried turning it off and on again?',

    ctx.font = '18px monospace';

}

  ctx.font = 'bold 16px monospace';

  ctx.fillText(`SCORE: ${score}`, 120, 24);
  ctx.fillStyle = '#FFD700';
  ctx.fillText(`🪙 ${coins}`, 340, 24);
  ctx.fillStyle = '#FFF';

  if (player.laserTimer > 0) {
    // Blinking laser HUD indicator
    const blink = Math.floor(Date.now() / 300) % 2 === 0;

// --- UPDATE ---
function update() {
  if (gameState === 'title') {
    if (keys['Enter']) {
      gameState = 'playing';
      lives = 3;
      score = 0;
      coins = 0;
      level = 1;
      loadLevel(1);
      stopMusic();
      playMusic();
      keys['Enter'] = false;
    }
    return;
  }

  if (gameState === 'gameover') {
    stopMusic();
    if (keys['Enter']) {
      gameState = 'title';
      keys['Enter'] = false;
    }
    return;
  }

  if (gameState === 'win') {
    winTimer++;
    if (keys['Enter'] && winTimer > 120) {
      if (level < LEVELS.length) {
        level++;
        loadLevel(level);
        gameState = 'playing';
        playMusic();
      } else {
        gameState = 'title';
      }
      keys['Enter'] = false;
    }
    return;
  }

  if (gameState === 'dead') {
    deathTimer++;
    player.vy += GRAVITY;
    player.y += player.vy;
    if (deathTimer > 90) {
      lives--;
      if (lives <= 0) {
        gameState = 'gameover';
        titleBlink = 0;
      } else {
        loadLevel(level);
        gameState = 'playing';
      }
    }
    return;
  }

  // Player movement
  const isUnderwater = LEVELS[level - 1].underwater;
  const speed = isUnderwater ? 0.35 : 0.5;
  const maxSpeed = isUnderwater ? 3.5 : 4.5;
  if (keys['ArrowLeft'] || keys['KeyA']) {
    player.vx -= speed;
    player.facing = -1;
  }
  if (keys['ArrowRight'] || keys['KeyD']) {
    player.vx += speed;
    player.facing = 1;
  }
  if (isUnderwater) {
    // Underwater: press Space to swim upward (repeatable)
    if (keys['Space'] || keys['ArrowUp'] || keys['KeyW']) {
      player.vy = Math.max(player.vy - 1.2, -5);
      if (Math.random() < 0.3) {
        particles.push({x: player.x + 12, y: player.y + 30, vx: (Math.random()-0.5)*0.5, vy: -Math.random()*2-1, life: 30, color: 'rgba(150,200,255,0.6)', size: Math.random()*4+2});
      }
    }
  } else {
    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
      player.vy = -13.5;
      sfxJump();
    }
  }

  // Sprint with Shift
  const sprinting = keys['ShiftLeft'] || keys['ShiftRight'];
  const currentMax = sprinting ? (isUnderwater ? 5.5 : 7.5) : maxSpeed;
  player.vx = Math.max(-currentMax, Math.min(currentMax, player.vx));
  const fric = isUnderwater ? 0.92 : FRICTION;
  if (!keys['ArrowLeft'] && !keys['ArrowRight'] && !keys['KeyA'] && !keys['KeyD']) {
    player.vx *= fric;
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
  }

  const grav = isUnderwater ? 0.25 : GRAVITY;
  const maxFall = isUnderwater ? 4 : 12;
  player.vy += grav;
  if (player.vy > maxFall) player.vy = maxFall;

  player.x += player.vx;
  player.y += player.vy;

  // Keep in bounds
  if (player.x < 0) { player.x = 0; player.vx = 0; }

  worldCollide(player);

  // Animation
  if (Math.abs(player.vx) > 0.5) {
    player.frameTimer++;
    if (player.frameTimer > 5) {
      player.frame++;
      player.frameTimer = 0;
    }
  } else {
    player.frame = 0;
  }

  if (player.invincible > 0) player.invincible--;
  if (player.starTimer > 0) {
    player.starTimer--;
    player.starFlash++;
    if (player.starTimer === 0) player.starFlash = 0;
  }

  // Update powerups
  for (const pu of powerups) {
    if (!pu.active) continue;
    if (pu.emerging) {
      pu.y -= 1;
      if (pu.y <= pu.emergeY) { pu.emerging = false; }
      continue;
    }
    pu.vy += GRAVITY;
    pu.x += pu.vx;
    pu.y += pu.vy;
    // Ground collision for powerup
    const puBottom = Math.floor((pu.y + pu.h) / TILE);
    const puLeft = Math.floor(pu.x / TILE);
    const puRight = Math.floor((pu.x + pu.w) / TILE);
    if (isSolid(puLeft, puBottom) || isSolid(puRight, puBottom)) {
      pu.y = puBottom * TILE - pu.h;
      pu.vy = 0;
    }
    // Wall collision
    if (isSolid(Math.floor(pu.x / TILE), Math.floor((pu.y + 12) / TILE))) pu.vx = Math.abs(pu.vx);
    if (isSolid(Math.floor((pu.x + pu.w) / TILE), Math.floor((pu.y + 12) / TILE))) pu.vx = -Math.abs(pu.vx);
    // Player pickup
    if (player.x + player.width > pu.x && player.x < pu.x + pu.w &&
        player.y + player.height > pu.y && player.y < pu.y + pu.h) {
      pu.active = false;
      if (pu.type === 'crab') {
        player.big = true;
        player.y -= 10; // Lift player so they don't clip into ground
        score += 500;
        sfxPowerup();
        floatTexts.push({x: pu.x, y: pu.y - 10, text: '🦀 sudo crab-up!', timer: 50, vy: -1.5});
      } else if (pu.type === 'starfish') {
        player.starTimer = 480;
        player.invincible = 480;
        score += 500;
        sfxStar();
        floatTexts.push({x: pu.x, y: pu.y - 10, text: '⭐ GOD MODE ON', timer: 50, vy: -1.5});
      } else if (pu.type === 'oneup') {
        lives++;
        sfxOneUp();
        floatTexts.push({x: pu.x, y: pu.y - 10, text: '1-UP!', timer: 60, vy: -1.5});
      } else if (pu.type === 'laser') {
        player.laserTimer = 600;
        score += 300;
        sfxPowerup();
        floatTexts.push({x: pu.x, y: pu.y - 10, text: '⚡ VIBE LASER! [X] to pew pew!', timer: 90, vy: -1});
      } else if (pu.type === 'mushroom') {
        player.mushroomTimer = 600; // ~10 seconds of trip
        score += 420;
        // Trippy sound
        playSound(300, 0.2, 'sine', 0.1);
        setTimeout(() => playSound(350, 0.3, 'sine', 0.12), 100);
        setTimeout(() => playSound(280, 0.4, 'sine', 0.1), 250);
        setTimeout(() => playSound(400, 0.3, 'sine', 0.08), 400);
        floatTexts.push({x: pu.x, y: pu.y - 10, text: '🍄 MAGIC MUSHROOM! 🍄', timer: 90, vy: -1});
      }
      const puColor = pu.type === 'mushroom' ? '#F0F' : pu.type === 'oneup' ? '#0F0' : pu.type === 'laser' ? '#0FF' : pu.type === 'crab' ? '#F66' : '#FFD700';
      for (let i = 0; i < 8; i++) {
        particles.push({x: pu.x+12, y: pu.y+12, vx: (Math.random()-0.5)*5, vy: -Math.random()*4-1, life: 30, color: puColor, size: 4});
      }
    }
    // Fall off screen
    if (pu.y > ROWS * TILE + 50) pu.active = false;
  }

  // Camera
  const targetCam = player.x - canvas.width / 3;
  const maxCam = LEVELS[level - 1].width * TILE - canvas.width;
  cameraX += (targetCam - cameraX) * 0.1;
  cameraX = Math.max(0, Math.min(maxCam, cameraX));

  // Laser timer & shooting
  if (player.laserTimer > 0) player.laserTimer--;
  if (player.mushroomTimer > 0) player.mushroomTimer--;
  if (player.laserCooldown > 0) player.laserCooldown--;
  if (player.laserTimer > 0 && (keys['KeyX'] || keys['KeyZ'] || keys['ControlLeft'] || keys['ControlRight']) && player.laserCooldown <= 0) {
    lasers.push({
      x: player.x + (player.facing > 0 ? player.width : 0),
      y: player.y + 12,
      vx: player.facing * 12,
      w: 24, h: 6, life: 60
    });
    // Muzzle flash particles
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: player.x + (player.facing > 0 ? player.width + 4 : -4),
        y: player.y + 12 + (Math.random()-0.5)*8,
        vx: player.facing * (Math.random()*3+1), vy: (Math.random()-0.5)*2,
        life: 10, color: '#0FF', size: 3
      });
    }
    player.laserCooldown = 12;
    sfxLaser();
  }

  // Update lasers — hit all enemy types
  function laserHitEnemy(laser, enemy, pts, color) {
    enemy.alive = false;
    enemy.squishTimer = 30;
    laser.life = 0;
    score += pts;
    sfxStomp();
    floatTexts.push({x: enemy.x, y: enemy.y - 10, text: `+${pts}`, timer: 40, vy: -1.5});
    for (let i = 0; i < 6; i++) {
      particles.push({x: enemy.x+14, y: enemy.y+12, vx: (Math.random()-0.5)*5, vy: -Math.random()*4-1, life: 25, color: color, size: 3});
    }
  }
  for (const laser of lasers) {
    laser.x += laser.vx;
    laser.life--;
    for (const crab of crabList) {
      if (!crab.alive || laser.life <= 0) continue;
      if (laser.x + laser.w > crab.x && laser.x < crab.x + crab.w && laser.y + laser.h > crab.y && laser.y < crab.y + crab.h) {
        laserHitEnemy(laser, crab, 250, '#F66');
      }
    }
    for (const jelly of jellyList) {
      if (!jelly.alive || laser.life <= 0) continue;
      if (laser.x + laser.w > jelly.x && laser.x < jelly.x + jelly.w && laser.y + laser.h > jelly.y && laser.y < jelly.y + jelly.h) {
        laserHitEnemy(laser, jelly, 300, '#C0F');
      }
    }
    for (const gull of seagullList) {
      if (!gull.alive || laser.life <= 0) continue;
      if (laser.x + laser.w > gull.x && laser.x < gull.x + gull.w && laser.y + laser.h > gull.y && laser.y < gull.y + gull.h) {
        laserHitEnemy(laser, gull, 350, '#FFF');
      }
    }
  }
  lasers = lasers.filter(l => l.life > 0);

  // Update jellyfish
  for (const jelly of jellyList) {
    if (!jelly.alive) { if (jelly.squishTimer > 0) jelly.squishTimer--; continue; }
    jelly.frame++;
    jelly.y = jelly.baseY + Math.sin(jelly.frame * 0.03) * 40;
    // Player collision
    const px = player.x, py = player.y, pw = player.width, ph = player.height;
    if (px + pw > jelly.x && px < jelly.x + jelly.w && py + ph > jelly.y && py < jelly.y + jelly.h) {
      if (player.starTimer > 0) {
        jelly.alive = false; jelly.squishTimer = 30; score += 300;
        sfxStomp(); floatTexts.push({x:jelly.x,y:jelly.y-10,text:'+300',timer:40,vy:-1.5});
      } else if (player.vy > 0 && py + ph - 8 < jelly.y + jelly.h/2) {
        jelly.alive = false; jelly.squishTimer = 30; player.vy = -8; score += 200;
        sfxStomp(); floatTexts.push({x:jelly.x,y:jelly.y-10,text:'+200',timer:40,vy:-1.5});
      } else if (player.invincible <= 0) {
        if (player.big) { player.big = false; player.invincible = 90; sfxDie(); }
        else { playerDie(); }
      }
    }
  }

  // Update seagulls (fly horizontally, swoop up and down)
  for (const gull of seagullList) {
    if (!gull.alive) { if (gull.squishTimer > 0) gull.squishTimer--; continue; }
    gull.frame++;
    gull.x += gull.vx;
    gull.y = gull.baseY + Math.sin(gull.frame * 0.04) * 25;
    // Wrap around or reverse
    if (gull.x < cameraX - 100) gull.vx = Math.abs(gull.vx);
    if (gull.x > cameraX + canvas.width + 100) gull.vx = -Math.abs(gull.vx);
    // Player collision
    const px = player.x, py = player.y, pw = player.width, ph = player.height;
    if (px + pw > gull.x && px < gull.x + gull.w && py + ph > gull.y && py < gull.y + gull.h) {
      if (player.starTimer > 0) {
        gull.alive = false; gull.squishTimer = 30; score += 350;
        sfxStomp(); floatTexts.push({x:gull.x,y:gull.y-10,text:'+350',timer:40,vy:-1.5});
      } else if (player.vy > 0 && py + ph - 8 < gull.y + gull.h/2) {
        gull.alive = false; gull.squishTimer = 30; player.vy = -10; score += 300;
        sfxStomp(); floatTexts.push({x:gull.x,y:gull.y-10,text:'+300',timer:40,vy:-1.5});
      } else if (player.invincible <= 0) {
        if (player.big) { player.big = false; player.invincible = 90; sfxDie(); }
        else { playerDie(); }
      }
    }
  }

  // Update urchins (stationary hazard — can't be stomped)
  for (const urchin of urchinList) {
    urchin.frame++;
    const px = player.x, py = player.y, pw = player.width, ph = player.height;
    if (px + pw > urchin.x + 4 && px < urchin.x + urchin.w - 4 && py + ph > urchin.y + 4 && py < urchin.y + urchin.h) {
      if (player.starTimer > 0) {
        // Star can destroy urchins — they explode
        urchin.x = -9999; score += 400;
        sfxStomp(); floatTexts.push({x:urchin.x,y:urchin.y-10,text:'+400',timer:40,vy:-1.5});
        for (let i = 0; i < 8; i++) particles.push({x:urchin.x+14,y:urchin.y+12,vx:(Math.random()-0.5)*6,vy:-Math.random()*5,life:30,color:'#A0A',size:4});
      } else if (player.invincible <= 0) {
        if (player.big) { player.big = false; player.invincible = 90; sfxDie(); }
        else { playerDie(); }
      }
    }
  }

  // Coins
  for (const coin of coinList) {
    if (coin.collected) continue;
    if (player.x + player.width > coin.x && player.x < coin.x + coin.w &&
        player.y + player.height > coin.y && player.y < coin.y + coin.h) {
      coin.collected = true;
      coins++;
      score += 50;
      sfxCoin();
      floatTexts.push({x: coin.x, y: coin.y - 10, text: '+50', timer: 30, vy: -1.5});
    }
  }

  // Crabs
  for (const crab of crabList) {
    if (!crab.alive) {
      if (crab.squishTimer > 0) crab.squishTimer--;
      continue;
    }
    crab.frame++;

    // Crab movement
    crab.x += crab.vx;
    // Simple ground check for crabs
    const crabTileBelow = isSolid(Math.floor((crab.x + 14) / TILE), Math.floor((crab.y + crab.h) / TILE));
    if (!crabTileBelow) {
      // Check if at edge, reverse
      // Actually let them keep going on ground
    }
    // Wall collision for crabs
    const crabTileLeft = isSolid(Math.floor(crab.x / TILE), Math.floor((crab.y + 12) / TILE));
    const crabTileRight = isSolid(Math.floor((crab.x + crab.w) / TILE), Math.floor((crab.y + 12) / TILE));
    if (crabTileLeft && crab.vx < 0) crab.vx = Math.abs(crab.vx);
    if (crabTileRight && crab.vx > 0) crab.vx = -Math.abs(crab.vx);

    // Player collision
    if (player.invincible <= 0 || true) {
      const px = player.x, py = player.y, pw = player.width, ph = player.height;
      if (px + pw > crab.x && px < crab.x + crab.w && py + ph > crab.y && py < crab.y + crab.h) {
        // Star power — destroy on contact
        if (player.starTimer > 0) {
          crab.alive = false;
          crab.squishTimer = 30;
          score += 300;
          sfxStomp();
          floatTexts.push({x: crab.x, y: crab.y - 10, text: '+300', timer: 40, vy: -1.5});
          for (let i = 0; i < 8; i++) {
            particles.push({x: crab.x+14, y: crab.y+12, vx: (Math.random()-0.5)*6, vy: -Math.random()*5-1, life: 30, color: '#FFD700', size: 4});
          }
        }
        // Check if stomping (player falling and feet above crab middle)
        else if (player.vy > 0 && py + ph - 8 < crab.y + crab.h / 2) {
          // Stomp!
          crab.alive = false;
          crab.squishTimer = 30;
          player.vy = -8;
          score += 200;
          sfxStomp();
          floatTexts.push({x: crab.x, y: crab.y - 10, text: '+200', timer: 40, vy: -1.5});
          for (let i = 0; i < 6; i++) {
            particles.push({x: crab.x+14, y: crab.y+12, vx: (Math.random()-0.5)*4, vy: -Math.random()*3-1, life: 25, color: '#F66', size: 3});
          }
        } else if (player.invincible <= 0) {
          // Hit by crab — if big, shrink instead of dying
          if (player.big) {
            player.big = false;
            player.invincible = 90;
            sfxDie();
            floatTexts.push({x: player.x, y: player.y - 10, text: 'OUCH!', timer: 40, vy: -1.5});
          } else {
            playerDie();
          }
        }
      }
    }
  }

  // Tubes — press DOWN to warp
  for (const tube of tubeList) {
    tube.frame++;
    if (!teleporting && player.x + player.width > tube.x + 8 && player.x < tube.x + tube.w - 8 &&
        player.y + player.height > tube.y && player.y < tube.y + tube.h &&
        (keys['ArrowDown'] || keys['KeyS'])) {
      teleporting = true;
      teleportTimer = 60;
      teleportPhase = 'in';
      teleportDest = {level: tube.destLevel, x: tube.destX, y: tube.destY};
      playSound(800, 0.1, 'sine', 0.15);
      setTimeout(() => playSound(600, 0.1, 'sine', 0.12), 50);
      setTimeout(() => playSound(400, 0.15, 'sine', 0.1), 100);
      keys['ArrowDown'] = false; keys['KeyS'] = false;
    }
  }
  if (teleporting) {
    teleportTimer--;
    if (teleportTimer === 30) {
      if (teleportDest.level !== level) {
        level = teleportDest.level;
        loadLevel(level);
        stopMusic(); playMusic();
      }
      player.x = teleportDest.x; player.y = teleportDest.y;
      player.vx = 0; player.vy = 0;
      cameraX = Math.max(0, player.x - canvas.width / 3);
      teleportPhase = 'out';
      playSound(200, 0.1, 'sine', 0.08);
      setTimeout(() => playSound(400, 0.1, 'sine', 0.1), 50);
      setTimeout(() => playSound(800, 0.15, 'sine', 0.15), 100);
    }
    if (teleportTimer <= 0) teleporting = false;
    return;
  }

  // Flag
  if (player.x + player.width > flagPos.x && player.x < flagPos.x + TILE) {
    gameState = 'win';
    winTimer = 0;
    score += 1000;
    stopMusic();
    sfxWin();
  }

  // Fall off screen
  if (player.y > ROWS * TILE + 100) {
    playerDie();
  }

  // Surprise easter eggs
  surpriseTimer++;
  // Crab Rave at random intervals
  if (!surpriseActive && surpriseTimer > 600 && Math.random() < 0.002) {
    surpriseActive = true;
    disco = true;
    discoTimer = 180; // 3 seconds of disco
    const msg = funMessages[Math.floor(Math.random() * funMessages.length)];
    floatTexts.push({x: player.x, y: player.y - 40, text: msg, timer: 120, vy: -0.5});
    // Give bonus points
    score += 500;
    sfxWin();
    surpriseTimer = 0;
  }
  if (disco) {
    discoTimer--;
    if (discoTimer <= 0) { disco = false; surpriseActive = false; }
    // Make all living crabs dance (bounce)
    for (const crab of crabList) {
      if (crab.alive) crab.y += Math.sin(discoTimer * 0.3) * 1.5;
    }
  }

  // Rare mega coin shower
  if (surpriseTimer > 0 && surpriseTimer % 1800 === 0 && Math.random() < 0.3) {
    floatTexts.push({x: player.x, y: player.y - 30, text: '💰 COIN SHOWER! 💰', timer: 60, vy: -1});
    for (let i = 0; i < 10; i++) {
      const rx = player.x + (Math.random() - 0.5) * 300;
      const ry = player.y - 100 - Math.random() * 100;
      coinList.push({x: rx, y: ry, w: 16, h: 16, collected: false, bobOffset: Math.random() * Math.PI * 2});
    }
    sfxCoin();
  }

  // Random gravity flip (brief)
  if (surpriseTimer > 900 && surpriseTimer % 2400 === 0 && Math.random() < 0.15) {
    player.vy = -14;
    floatTexts.push({x: player.x, y: player.y - 30, text: '🔄 GRAVITY BURP!', timer: 60, vy: -1});
    playSound(200, 0.3, 'sine', 0.1);
  }

  // Random speed boost
  if (surpriseTimer > 1200 && surpriseTimer % 3000 === 0 && Math.random() < 0.2) {
    player.vx = player.facing * 8;
    floatTexts.push({x: player.x, y: player.y - 30, text: '💨 YEET!', timer: 40, vy: -1.5});
    playSound(500, 0.15, 'sawtooth', 0.1);
    for (let i = 0; i < 8; i++) {
      particles.push({x: player.x, y: player.y+15, vx: -player.facing*(Math.random()*3+1), vy: (Math.random()-0.5)*2, life: 20, color: '#FF0', size: 3});
    }
  }

  // Particles
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // Float texts
  for (const ft of floatTexts) {
    ft.y += ft.vy;
    ft.timer--;
  }
  floatTexts = floatTexts.filter(ft => ft.timer > 0);
}

function playerDie() {
  if (gameState === 'dead') return;
  gameState = 'dead';
  player.vy = -10;
  deathTimer = 0;
  sfxDie();
}

// --- RENDER ---
function render() {
  const L = LEVELS[Math.min(level, LEVELS.length) - 1];

  if (gameState === 'title') {
    drawTitle();
    return;
  }

  if (gameState === 'gameover') {
    drawGameOver();
    return;
  }

  // Sky
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  if (L.bg === '#1a1a2e') {
    grad.addColorStop(0, '#0a0a1e');
    grad.addColorStop(1, '#1a1a2e');
  } else {
    grad.addColorStop(0, '#2848a8');
    grad.addColorStop(1, L.bg);
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (L.space) {
    // Stars in space
    ctx.fillStyle = '#FFF';
    for (let i = 0; i < 60; i++) {
      const sx = ((i * 97 + 13) * 7) % canvas.width;
      const sy = ((i * 53 + 7) * 11) % (canvas.height - 80);
      const twinkle = Math.sin(Date.now() * 0.003 + i) * 0.4 + 0.6;
      ctx.globalAlpha = twinkle;
      ctx.fillRect(sx, sy, i % 3 === 0 ? 2 : 1, i % 3 === 0 ? 2 : 1);
    }
    ctx.globalAlpha = 1;
    // Distant planets
    ctx.fillStyle = '#334';
    ctx.beginPath();
    ctx.arc(200 - cameraX * 0.05, 80, 35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#445';
    ctx.beginPath();
    ctx.arc(600 - cameraX * 0.03, 50, 20, 0, Math.PI * 2);
    ctx.fill();
    // Nebula glow
    const nebG = ctx.createRadialGradient(400, 100, 10, 400, 100, 150);
    nebG.addColorStop(0, 'rgba(100,0,200,0.08)');
    nebG.addColorStop(1, 'rgba(0,0,50,0)');
    ctx.fillStyle = nebG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else if (L.volcano) {
    // Volcano background — lava glow, floating embers
    const lavaGlow = ctx.createLinearGradient(0, canvas.height - 100, 0, canvas.height);
    lavaGlow.addColorStop(0, 'rgba(200,50,0,0)');
    lavaGlow.addColorStop(1, 'rgba(200,50,0,0.3)');
    ctx.fillStyle = lavaGlow;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Embers floating up
    ctx.fillStyle = '#F80';
    for (let i = 0; i < 15; i++) {
      const ex = (i * 120 + Math.sin(Date.now() * 0.001 + i * 3) * 30) % canvas.width;
      const ey = canvas.height - ((Date.now() * 0.02 + i * 60) % (canvas.height + 30));
      const es = 2 + Math.sin(i) * 1;
      ctx.globalAlpha = 0.6 + Math.sin(Date.now() * 0.005 + i) * 0.3;
      ctx.fillRect(ex, ey, es, es);
    }
    ctx.globalAlpha = 1;
    // Distant volcano
    ctx.fillStyle = '#1a0800';
    ctx.beginPath();
    ctx.moveTo(600 - cameraX * 0.1, canvas.height - 64);
    ctx.lineTo(650 - cameraX * 0.1, 80);
    ctx.lineTo(700 - cameraX * 0.1, canvas.height - 64);
    ctx.fill();
    // Lava drip from volcano top
    ctx.fillStyle = '#F40';
    ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.003) * 0.3;
    ctx.beginPath();
    ctx.arc(650 - cameraX * 0.1, 80, 8 + Math.sin(Date.now() * 0.005) * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  } else if (L.underwater) {
    // Underwater background effects
    // Light rays
    ctx.save();
    ctx.globalAlpha = 0.05;
    for (let i = 0; i < 5; i++) {
      const rx = ((i * 200 + Date.now() * 0.01) % (canvas.width + 100)) - 50;
      ctx.fillStyle = '#88CCFF';
      ctx.beginPath();
      ctx.moveTo(rx, 0);
      ctx.lineTo(rx + 40, 0);
      ctx.lineTo(rx + 80, canvas.height);
      ctx.lineTo(rx - 40, canvas.height);
      ctx.fill();
    }
    ctx.restore();
    // Seaweed
    ctx.fillStyle = '#1a6a3a';
    for (let i = 0; i < 20; i++) {
      const sx = ((i * 180) - cameraX * 0.8) % (canvas.width + 300);
      const sway = Math.sin(Date.now() * 0.002 + i) * 5;
      const sh = 30 + (i % 3) * 20;
      ctx.beginPath();
      ctx.moveTo(sx, canvas.height - 64);
      ctx.quadraticCurveTo(sx + sway, canvas.height - 64 - sh/2, sx + sway*1.5, canvas.height - 64 - sh);
      ctx.quadraticCurveTo(sx + sway + 4, canvas.height - 64 - sh/2, sx + 6, canvas.height - 64);
      ctx.fill();
    }
    // Background bubbles
    ctx.fillStyle = 'rgba(150,200,255,0.2)';
    for (let i = 0; i < 12; i++) {
      const bx = (i * 120 + Math.sin(Date.now() * 0.001 + i * 2) * 20) % canvas.width;
      const by = (canvas.height - ((Date.now() * 0.03 + i * 80) % (canvas.height + 50)));
      const br = 3 + (i % 3) * 2;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (L.matrix) {
    ctx.fillStyle = '#0F0'; ctx.font = '12px monospace';
    for (let col = 0; col < 60; col++) {
      const speed = 1 + (col%5)*0.5;
      const x = (col*14) % canvas.width;
      const yOff = (Date.now()*speed*0.05 + col*100) % (canvas.height+200) - 100;
      for (let ch = 0; ch < 8; ch++) {
        const cy = yOff + ch*16;
        if (cy < 0 || cy > canvas.height) continue;
        ctx.globalAlpha = Math.max(0, 1 - ch*0.12);
        ctx.fillText(String.fromCharCode(0x30A0 + Math.floor(Math.random()*96)), x, cy);
      }
    }
    ctx.globalAlpha = 1;
  } else if (L.candy) {
    const colors = ['#FFB6C1','#DDA0DD','#FFD700','#87CEEB','#98FB98'];
    for (let i = 0; i < 10; i++) {
      const cx = ((i*200+50)-cameraX*0.3) % (canvas.width+200);
      const cy = 30 + (i%3)*40;
      ctx.fillStyle = colors[i%colors.length]+'AA';
      ctx.beginPath(); ctx.arc(cx,cy,20+(i%3)*8,0,Math.PI*2); ctx.arc(cx+20,cy-5,18,0,Math.PI*2); ctx.arc(cx+40,cy,22,0,Math.PI*2); ctx.fill();
    }
    for (let i = 0; i < 5; i++) {
      const lx = ((i*300+100)-cameraX*0.5) % (canvas.width+300);
      ctx.fillStyle = '#888'; ctx.fillRect(lx+8,canvas.height-100,4,40);
      ctx.fillStyle = colors[(i+2)%colors.length]; ctx.beginPath(); ctx.arc(lx+10,canvas.height-110,15,0,Math.PI*2); ctx.fill();
    }
  } else if (L.upsideDown) {
    for (let i = 0; i < 40; i++) {
      const sx = (i*67+Math.sin(Date.now()*0.0005+i)*40) % canvas.width;
      const sy = (Date.now()*0.008+i*50) % canvas.height;
      ctx.fillStyle = i%3===0 ? 'rgba(200,100,255,0.3)' : 'rgba(150,50,200,0.2)';
      ctx.beginPath(); ctx.arc(sx,sy,Math.abs(Math.sin(i))*2+1,0,Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(80,20,100,0.4)'; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const vx = ((i*150)-cameraX*0.4) % (canvas.width+200);
      const sway = Math.sin(Date.now()*0.001+i)*15;
      ctx.beginPath(); ctx.moveTo(vx,0); ctx.quadraticCurveTo(vx+sway,60,vx+sway*1.5,80+(i%3)*30); ctx.stroke();
    }
  } else if (L.neonCity) {
    ctx.strokeStyle = '#F0F'; ctx.lineWidth = 1; ctx.globalAlpha = 0.3;
    for (let gx = 0; gx < canvas.width; gx += 40) { ctx.beginPath(); ctx.moveTo(gx,canvas.height-80); ctx.lineTo(canvas.width/2,canvas.height/2); ctx.stroke(); }
    for (let gy = canvas.height-80; gy > canvas.height/2; gy -= 20) { ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(canvas.width,gy); ctx.stroke(); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0a0020';
    const blds = [40,80,60,120,50,90,70,110,45,85,65,100,55];
    for (let i = 0; i < blds.length; i++) {
      const bx = ((i*70)-cameraX*0.15) % (canvas.width+100);
      ctx.fillRect(bx,canvas.height-64-blds[i],50,blds[i]);
      const wc = i%3===0?'#F0F':i%3===1?'#0FF':'#FF0';
      for (let wy = 0; wy < blds[i]-10; wy += 15) for (let wx = 5; wx < 45; wx += 12)
        if (Math.sin(i*7+wy+wx)>0) { ctx.fillStyle = wc+'88'; ctx.fillRect(bx+wx,canvas.height-64-blds[i]+5+wy,6,8); }
    }
    ctx.save(); ctx.shadowColor='#F0F'; ctx.shadowBlur=10; ctx.fillStyle='#F0F'; ctx.font='bold 14px monospace';
    ctx.fillText('CYBER CRAB',(200-cameraX*0.15)%(canvas.width+100),canvas.height-150);
    ctx.shadowColor='#0FF'; ctx.fillStyle='#0FF';
    ctx.fillText('NEON SHELL',(500-cameraX*0.15)%(canvas.width+100),canvas.height-130);
    ctx.restore();
  } else if (L.theVoid) {
    for (let i = 0; i < 6; i++) {
      const vx = (i*200+Math.sin(Date.now()*0.0003+i)*100) % canvas.width;
      const vy = 50+(i*80)%(canvas.height-100);
      const pulse = Math.sin(Date.now()*0.001+i*1.5)*0.5+0.5;
      ctx.strokeStyle = 'rgba(255,255,255,'+(pulse*0.15)+')'; ctx.lineWidth = 1;
      ctx.beginPath();
      if (i%3===0) ctx.arc(vx,vy,30+pulse*20,0,Math.PI*2);
      else if (i%3===1) ctx.rect(vx-20,vy-20,40+pulse*20,40+pulse*20);
      else { ctx.moveTo(vx,vy-30); ctx.lineTo(vx+30,vy+20); ctx.lineTo(vx-30,vy+20); ctx.closePath(); }
      ctx.stroke();
    }
    const voidTxts = ['ARE YOU STILL PLAYING?','WHAT IS A CRAB, REALLY?','THE VOID STARES BACK','...'];
    const vti = Math.floor(Date.now()/5000) % voidTxts.length;
    ctx.fillStyle = 'rgba(255,255,255,'+(Math.sin(Date.now()*0.001)*0.3+0.3)+')';
    ctx.font = '14px monospace'; ctx.textAlign = 'center';
    ctx.fillText(voidTxts[vti], canvas.width/2, canvas.height/2-50);
    ctx.textAlign = 'left';
  } else {
    drawClouds();
    drawHills();
  }

  // Tiles
  for (const tile of levelTiles) {
    drawTile(tile);
  }

  // Coins
  for (const coin of coinList) {
    if (!coin.collected) drawCoin(coin);
  }

  // Crabs
  for (const crab of crabList) {
    if (crab.alive || crab.squishTimer > 0) drawCrab(crab);
  }

  // Jellyfish
  for (const jelly of jellyList) {
    if (!jelly.alive && jelly.squishTimer <= 0) continue;
    const jx = Math.round(jelly.x - cameraX);
    const jy = Math.round(jelly.y);
    if (jelly.squishTimer > 0 && !jelly.alive) {
      ctx.fillStyle = '#808';
      ctx.fillRect(jx + 2, jy + 16, 20, 6);
    } else {
      // Translucent dome
      const pulse = Math.sin(jelly.frame * 0.06) * 0.2 + 0.8;
      ctx.save();
      ctx.globalAlpha = 0.7 * pulse;
      ctx.fillStyle = '#C060F0';
      ctx.beginPath();
      ctx.arc(jx + 12, jy + 10, 12, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#D080FF';
      ctx.fillRect(jx + 2, jy + 10, 20, 6);
      // Tentacles
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#C060F0';
      ctx.lineWidth = 2;
      for (let t = 0; t < 4; t++) {
        const tx = jx + 4 + t * 6;
        ctx.beginPath();
        ctx.moveTo(tx, jy + 16);
        ctx.quadraticCurveTo(tx + Math.sin(jelly.frame*0.08+t)*3, jy + 22, tx + Math.sin(jelly.frame*0.05+t)*2, jy + 28);
        ctx.stroke();
      }
      // Eyes
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#FFF';
      ctx.fillRect(jx + 6, jy + 6, 4, 4);
      ctx.fillRect(jx + 14, jy + 6, 4, 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(jx + 7, jy + 7, 2, 2);
      ctx.fillRect(jx + 15, jy + 7, 2, 2);
      ctx.restore();
    }
  }

  // Seagulls
  for (const gull of seagullList) {
    if (!gull.alive && gull.squishTimer <= 0) continue;
    const gx = Math.round(gull.x - cameraX);
    const gy = Math.round(gull.y);
    if (gull.squishTimer > 0 && !gull.alive) {
      ctx.fillStyle = '#888';
      ctx.fillRect(gx + 4, gy + 14, 22, 5);
    } else {
      const wingAngle = Math.sin(gull.frame * 0.12) * 0.4;
      ctx.save();
      // Body
      ctx.fillStyle = '#EEE';
      ctx.fillRect(gx + 8, gy + 8, 14, 8);
      // Head
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(gx + 24, gy + 8, 5, 0, Math.PI * 2);
      ctx.fill();
      // Beak
      ctx.fillStyle = '#F80';
      ctx.fillRect(gx + 28, gy + 7, 5, 3);
      // Eye
      ctx.fillStyle = '#000';
      ctx.fillRect(gx + 25, gy + 6, 2, 2);
      // Wings
      ctx.fillStyle = '#DDD';
      ctx.save();
      ctx.translate(gx + 15, gy + 8);
      ctx.rotate(-wingAngle);
      ctx.fillRect(-12, -2, 12, 5);
      ctx.restore();
      ctx.save();
      ctx.translate(gx + 15, gy + 8);
      ctx.rotate(wingAngle);
      ctx.fillRect(-12, -2, 12, 5);
      ctx.restore();
      ctx.restore();
    }
  }

  // Urchins
  for (const urchin of urchinList) {
    const ux = Math.round(urchin.x - cameraX);
    const uy = Math.round(urchin.y);
    if (ux < -TILE || ux > canvas.width + TILE) continue;
    // Spiky ball
    ctx.fillStyle = '#2a0040';
    ctx.beginPath();
    ctx.arc(ux + 14, uy + 12, 10, 0, Math.PI * 2);
    ctx.fill();
    // Spikes
    ctx.strokeStyle = '#6a00a0';
    ctx.lineWidth = 2;
    for (let s = 0; s < 8; s++) {
      const ang = (s / 8) * Math.PI * 2 + urchin.frame * 0.02;
      ctx.beginPath();
      ctx.moveTo(ux + 14 + Math.cos(ang) * 8, uy + 12 + Math.sin(ang) * 8);
      ctx.lineTo(ux + 14 + Math.cos(ang) * 16, uy + 12 + Math.sin(ang) * 16);
      ctx.stroke();
    }
    // Eyes
    ctx.fillStyle = '#F00';
    ctx.fillRect(ux + 10, uy + 9, 3, 3);
    ctx.fillRect(ux + 16, uy + 9, 3, 3);
  }

  // Flag
  // Tubes
  for (const tube of tubeList) {
    const tx = Math.round(tube.x - cameraX);
    const ty = Math.round(tube.y);
    ctx.save();
    const swirl = tube.frame * 0.05;
    const grd = ctx.createRadialGradient(tx+TILE, ty+TILE, 5, tx+TILE, ty+TILE, TILE*1.2);
    grd.addColorStop(0, tube.color);
    grd.addColorStop(0.5, tube.color + '88');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(tx-10, ty-10, TILE*2+20, TILE*2+20);
    for (let r = 0; r < 3; r++) {
      const radius = 12 + r * 8;
      const angle = swirl + r * 2.1;
      ctx.strokeStyle = tube.color;
      ctx.lineWidth = 3 - r * 0.5;
      ctx.globalAlpha = 0.7 - r * 0.2;
      ctx.beginPath();
      ctx.arc(tx+TILE, ty+TILE, radius, angle, angle + Math.PI * 1.5);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(tx+TILE, ty+TILE, 6 + Math.sin(swirl*2)*2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = tube.color;
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('\u2193 WARP', tx+TILE, ty-5);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  drawFlag();

  // Powerups
  for (const pu of powerups) {
    if (!pu.active) continue;
    const ppx = Math.round(pu.x - cameraX);
    const ppy = Math.round(pu.y);
    if (pu.type === 'crab') {
      // Mini crab powerup (orange/friendly)
      ctx.fillStyle = '#FF8800';
      ctx.fillRect(ppx + 2, ppy + 4, 20, 14);
      ctx.fillStyle = '#FFAA44';
      ctx.fillRect(ppx + 4, ppy + 6, 16, 10);
      ctx.fillStyle = '#FF8800';
      ctx.fillRect(ppx - 2, ppy + 4, 6, 5);
      ctx.fillRect(ppx + 20, ppy + 4, 6, 5);
      ctx.fillStyle = '#FFF';
      ctx.fillRect(ppx + 6, ppy + 2, 4, 4);
      ctx.fillRect(ppx + 14, ppy + 2, 4, 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(ppx + 8, ppy + 3, 2, 2);
      ctx.fillRect(ppx + 16, ppy + 3, 2, 2);
      // Up arrow indicator
      ctx.fillStyle = '#0F0';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('↑', ppx + 9, ppy);
    } else if (pu.type === 'starfish') {
      // Starfish (golden, sparkly)
      const glow = Math.sin(Date.now() * 0.01) * 0.3 + 0.7;
      ctx.save();
      ctx.globalAlpha = glow;
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      const cx = ppx + 12, cy = ppy + 12;
      for (let i = 0; i < 5; i++) {
        const angle = (i * 72 - 90) * Math.PI / 180;
        const innerAngle = ((i * 72) + 36 - 90) * Math.PI / 180;
        ctx.lineTo(cx + Math.cos(angle) * 12, cy + Math.sin(angle) * 12);
        ctx.lineTo(cx + Math.cos(innerAngle) * 5, cy + Math.sin(innerAngle) * 5);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (pu.type === 'oneup') {
      // 1-UP green mushroom
      ctx.fillStyle = '#00CC00';
      ctx.beginPath();
      ctx.arc(ppx + 12, ppy + 8, 10, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#008800';
      ctx.fillRect(ppx + 8, ppy + 8, 8, 10);
      ctx.fillStyle = '#FFF';
      ctx.fillRect(ppx + 7, ppy + 2, 5, 5);
      ctx.fillRect(ppx + 14, ppy + 2, 5, 5);
      ctx.fillStyle = '#00CC00';
      ctx.font = 'bold 8px monospace';
      ctx.fillText('1UP', ppx + 3, ppy + 23);
    } else if (pu.type === 'laser') {
      // Laser powerup — glowing cyan orb
      const pulse = Math.sin(Date.now() * 0.008) * 0.3 + 0.7;
      ctx.save();
      ctx.shadowColor = '#0FF';
      ctx.shadowBlur = 10 * pulse;
      ctx.fillStyle = '#0FF';
      ctx.beginPath();
      ctx.arc(ppx + 12, ppy + 12, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(ppx + 12, ppy + 12, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Lightning bolt
      ctx.fillStyle = '#006';
      ctx.font = 'bold 14px monospace';
      ctx.fillText('⚡', ppx + 4, ppy + 17);
      ctx.restore();
    } else if (pu.type === 'mushroom') {
      // Magic mushroom — psychedelic colors
      const hue = (Date.now() * 0.1) % 360;
      ctx.save();
      ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
      ctx.shadowBlur = 8;
      // Stem
      ctx.fillStyle = '#EEE';
      ctx.fillRect(ppx + 8, ppy + 12, 8, 10);
      // Cap
      ctx.fillStyle = `hsl(${hue}, 80%, 50%)`;
      ctx.beginPath();
      ctx.arc(ppx + 12, ppy + 10, 11, Math.PI, 0);
      ctx.fill();
      // Spots
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(ppx + 8, ppy + 5, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ppx + 16, ppy + 6, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ppx + 12, ppy + 2, 2, 0, Math.PI * 2);
      ctx.fill();
      // Eyes (trippy spiral eyes)
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(ppx + 9, ppy + 14, 2, 0, Math.PI * 2);
      ctx.arc(ppx + 15, ppy + 14, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // Lasers
  for (const laser of lasers) {
    const lx = Math.round(laser.x - cameraX);
    const ly = Math.round(laser.y);
    // Outer glow
    ctx.save();
    ctx.shadowColor = '#0FF';
    ctx.shadowBlur = 15;
    ctx.fillStyle = 'rgba(0,255,255,0.4)';
    ctx.fillRect(lx - 3, ly - 3, laser.w + 6, laser.h + 6);
    // Core beam
    ctx.fillStyle = '#0FF';
    ctx.fillRect(lx, ly, laser.w, laser.h);
    // Hot center
    ctx.fillStyle = '#FFF';
    ctx.fillRect(lx + 3, ly + 1, laser.w - 6, laser.h - 2);
    // Leading edge spark
    const sparkX = laser.vx > 0 ? lx + laser.w : lx;
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(sparkX, ly + laser.h/2, 4 + Math.random()*2, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // Player
  if (gameState !== 'dead' || deathTimer < 90) {
    drawPixelChar(player.x, player.y, player.facing, player.frame);
  }

  // Underwater overlay tint
  if (LEVELS[Math.min(level, LEVELS.length) - 1].underwater) {
    ctx.fillStyle = 'rgba(0, 40, 80, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Particles
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 30;
    ctx.fillRect(p.x - cameraX, p.y, p.size, p.size);
    ctx.globalAlpha = 1;
  }

  // Float texts
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  for (const ft of floatTexts) {
    ctx.fillStyle = '#FFF';
    ctx.globalAlpha = ft.timer / 40;
    ctx.fillText(ft.text, ft.x - cameraX + 16, ft.y);
    ctx.globalAlpha = 1;
  }

  // Disco overlay during crab rave
  if (disco && gameState === 'playing') {
    ctx.save();
    const hue = (Date.now() / 5) % 360;
    ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.08)`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Disco ball sparkles
    for (let i = 0; i < 8; i++) {
      const sx = Math.random() * canvas.width;
      const sy = Math.random() * canvas.height;
      ctx.fillStyle = `hsla(${(hue + i * 45) % 360}, 100%, 80%, 0.5)`;
      ctx.fillRect(sx, sy, 4, 4);
    }
    ctx.restore();
  }

  // Mushroom trip overlay
  if (player.mushroomTimer > 0 && gameState === 'playing') {
    ctx.save();
    const tripIntensity = Math.min(player.mushroomTimer / 100, 1);
    // Rainbow hue cycling overlay
    const hue = (Date.now() * 0.08) % 360;
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.08 * tripIntensity;
    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Wobble — draw wavy horizontal distortion
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.04 * tripIntensity;
    for (let sy = 0; sy < canvas.height; sy += 30) {
      const wobX = Math.sin(sy * 0.05 + Date.now() * 0.003) * 8 * tripIntensity;
      ctx.fillStyle = `hsl(${(hue + sy) % 360}, 100%, 70%)`;
      ctx.fillRect(wobX, sy, canvas.width, 2);
    }
    ctx.globalAlpha = 1;
    // Floating hallucination particles
    for (let i = 0; i < 5; i++) {
      const fx = (Date.now() * 0.02 + i * 200) % canvas.width;
      const fy = (Math.sin(Date.now() * 0.001 + i * 3) + 1) * canvas.height * 0.4;
      const fhue = (hue + i * 72) % 360;
      ctx.fillStyle = `hsla(${fhue}, 100%, 70%, ${0.3 * tripIntensity})`;
      ctx.font = '20px serif';
      ctx.fillText(['🍄','✨','🌀','💫','🌈'][i], fx, fy);
    }
    // Timer indicator
    ctx.fillStyle = '#F0F';
    ctx.font = 'bold 12px monospace';
    ctx.globalAlpha = 0.7;
    ctx.fillText('🍄 ' + Math.ceil(player.mushroomTimer / 60) + 's', 10, canvas.height - 10);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  drawHUD();

  if (gameState === 'win') drawWin();

  // Teleport transition
  if (teleporting) {
    ctx.save();
    const progress = teleportPhase === 'in' ? 1 - teleportTimer/60 : teleportTimer/30;
    ctx.fillStyle = 'rgba(0,0,0,'+Math.min(progress*1.5, 0.9)+')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width/2, cy = canvas.height/2;
    for (let i = 0; i < 12; i++) {
      const angle = Date.now()*0.01 + i*(Math.PI*2/12);
      const dist = 50 + progress*200;
      const hue = (i*30 + Date.now()*0.5) % 360;
      ctx.fillStyle = 'hsla('+hue+', 100%, 60%, '+(0.6-progress*0.3)+')';
      ctx.beginPath();
      ctx.arc(cx+Math.cos(angle)*dist*(1-progress), cy+Math.sin(angle)*dist*(1-progress), 15-progress*10, 0, Math.PI*2);
      ctx.fill();
    }
    if (progress > 0.3) {
      ctx.fillStyle = '#FFF'; ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center';
      const lvlNames = ['','OVERWORLD','NIGHT','OCEAN','SPACE','VOLCANO','MATRIX','CANDY','UPSIDE DOWN','NEON','VOID'];
      ctx.fillText(teleportPhase === 'in' ? 'WARPING...' : (lvlNames[level]||'WORLD '+level), cx, cy);
      ctx.textAlign = 'left';
    }
    ctx.restore();
  }
}

// --- GAME LOOP ---
function gameLoop() {
  try { update(); render(); } catch(e) {
    ctx.fillStyle='#F00'; ctx.font='16px monospace';
    ctx.fillText('BUG: '+e.message,10,50);
    console.error(e); return;
  }
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
